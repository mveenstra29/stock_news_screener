[project]
name = "portfolio-narrator"
version = "0.1.0"
description = "Generates a daily natural-language narrative of your portfolio's price moves, backed by pre-computed numbers and recent news."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.4.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "yfinance>=1.7.0",
]

[project.scripts]
portfolio-narrator = "portfolio_narrator.main:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
